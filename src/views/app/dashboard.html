<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Filemoon - Dashboard</title>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
		<script src="../js/layout.js" defer></script>
	</head>
	<body class="bg-zinc-100 min-h-screen flex">
		<!-- Sidebar -->
		<aside class="h-screen bg-white border-r-1 border-zinc-300 w-[24vw] flex justify-center p-5" id="sidebar">
			<!-- User Profile -->
			<div>
				<div class="border w-[6rem] h-[6rem] rounded-full overflow-hidden">
					<img class="w-full h-full object-cover" src="https://api.dicebear.com/7.x/avataaars/svg?seed=male-595" alt="" />
				</div>
				<p>Shubhajit Paul</p>
			</div>
		</aside>
		<!-- Dashboard -->
		<div class="w-full min-h-screen bg-zinc-100">
			<!-- Header -->
			<header class="bg-white h-18 py-3 px-8 flex justify-between items-center">
				<!-- Logo -->
				<div class="flex justify-center items-center gap-1">
					<i class="ri-contrast-2-fill text-4xl text-purple-500 leading-none"></i>
					<h1 class="text-2xl font-bold text-zinc-700/90 leading-none">Filemoon</h1>
				</div>
				<!-- Menu icon -->
				<i class="ri-menu-line text-2xl cursor-pointer px-2.5 py-1 bg-zinc-200/50 rounded-md" id="toggle-sidebar-btn"></i>
			</header>
		</div>
	</body>
</html>
