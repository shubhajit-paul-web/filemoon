<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- favicons -->
        <link rel="icon" type="image/svg+xml" href="../assets/favicons/favicon.svg" />
        <link rel="shortcut icon" href="../assets/favicons/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="../assets/favicons/apple-touch-icon.png"
        />
        <meta name="apple-mobile-web-app-title" content="Filemoon" />
        <link rel="manifest" href="../assets/favicons/site.webmanifest" />
        <title>History - Filemoon</title>
        <!-- Sweet alert -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <!-- Axios CDN -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <!-- Moment JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
        <!-- Notyf CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js" defer></script>
        <!-- Index JS file -->
        <script src="../js/apis/index.js" type="module"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="../js/layout.js" defer></script>
        <script src="../js/apis/history.js" type="module" defer></script>
        <style>
            body {
                font-family: "Inter", sans-serif;
            }
            button:disabled {
                cursor: not-allowed;
                opacity: 0.6;
            }
            /* Custom scrollbar */
            .custom-scrollbar::-webkit-scrollbar {
                height: 6px;
                width: 6px;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                background: #f1f1f1;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                background: #d4d4d8;
                border-radius: 3px;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                background: #a1a1aa;
            }
        </style>
    </head>
    <body class="bg-zinc-50 min-h-screen flex text-zinc-800">
        <!-- Sidebar -->
        <aside
            style="left: -100%"
            class="fixed top-0 bg-white w-[260px] h-screen z-50 border-r border-zinc-200 shadow-xl shadow-zinc-200/50 flex flex-col px-6 py-6 transition-all duration-300 ease-in-out"
            id="sidebar"
        >
            <div class="flex items-center justify-between mb-8 px-2">
                <div class="flex items-center gap-2">
                    <i class="ri-contrast-2-fill text-3xl text-indigo-600"></i>
                    <h1 class="text-xl font-bold text-zinc-800 tracking-tight">Filemoon</h1>
                </div>
            </div>

            <!-- User Profile -->
            <div
                class="flex items-center gap-3 p-3 bg-zinc-50 rounded-xl border border-zinc-100 mb-6"
            >
                <div class="w-10 h-10 min-w-10 rounded-full overflow-hidden border border-zinc-200">
                    <img
                        class="w-full h-full object-cover object-center"
                        src="https://api.dicebear.com/7.x/avataaars/svg?seed=male-595"
                        alt=""
                        id="user-profile-img"
                    />
                </div>
                <div class="overflow-hidden">
                    <p
                        class="text-sm font-semibold text-zinc-800 truncate capitalize"
                        id="user-fullname"
                    ></p>
                    <p class="text-xs text-zinc-500 truncate" id="user-email"></p>
                </div>
            </div>

            <!-- Menu items -->
            <nav class="flex-1 flex flex-col gap-1.5">
                <a
                    class="flex items-center gap-3 px-3 py-2.5 text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 font-medium rounded-lg transition-colors"
                    href="/dashboard"
                >
                    <i class="ri-dashboard-line text-lg"></i>
                    <span>Dashboard</span>
                </a>
                <a
                    class="flex items-center gap-3 px-3 py-2.5 text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 font-medium rounded-lg transition-colors"
                    href="/files"
                >
                    <i class="ri-folder-line text-lg"></i>
                    <span>My Files</span>
                </a>
                <a
                    class="flex items-center gap-3 px-3 py-2.5 bg-indigo-50 text-indigo-700 font-medium rounded-lg transition-colors"
                    href="/history"
                >
                    <i class="ri-history-line text-lg"></i>
                    <span>History</span>
                </a>
            </nav>

            <div class="mt-auto">
                <button
                    class="w-full flex items-center gap-3 px-3 py-2.5 text-red-600 hover:bg-red-50 font-medium rounded-lg transition-colors cursor-pointer"
                    id="logout-btn"
                >
                    <i class="ri-logout-box-line text-lg"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="w-full min-h-screen bg-zinc-50 pl-0 lg:pl-0 transition-all duration-300">
            <!-- Header -->
            <header
                class="bg-white/80 backdrop-blur-md sticky top-0 z-40 h-16 px-6 lg:px-8 flex justify-between items-center border-b border-zinc-200"
            >
                <!-- Mobile Menu Toggle -->
                <div class="flex items-center gap-4">
                    <button
                        id="toggle-sidebar-btn"
                        class="p-2 rounded-lg hover:bg-zinc-100 text-zinc-600 focus:outline-none cursor-pointer"
                    >
                        <i class="ri-menu-2-line text-xl"></i>
                    </button>
                    <h2 class="text-lg font-semibold text-zinc-800 lg:hidden">History</h2>
                </div>

                <!-- Actions -->
                <div>
                    <button
                        class="flex items-center gap-2 hover:bg-zinc-50 p-1 pr-2 rounded-full transition-colors border border-transparent hover:border-zinc-200"
                    >
                        <img
                            class="w-8 h-8 rounded-full border border-zinc-200 object-cover object-center"
                            src="https://api.dicebear.com/7.x/avataaars/svg?seed=male-595"
                            alt=""
                            id="user-avatar-header"
                        />
                        <i class="ri-arrow-down-s-line text-zinc-400"></i>
                    </button>
                </div>
            </header>

            <!-- History Section -->
            <main class="p-6 lg:p-8 max-w-7xl mx-auto">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                    <div>
                        <h2 class="text-2xl font-bold text-zinc-800 tracking-tight">
                            Shared History
                        </h2>
                        <p class="text-sm text-zinc-500 mt-1">
                            Track files you've shared with others
                        </p>
                    </div>
                    <!-- <div class="flex items-center gap-3">
                        <button
                            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-lg shadow-indigo-600/20 cursor-pointer"
                        >
                            <i class="ri-download-cloud-2-line"></i>
                            <span>Export CSV</span>
                        </button>
                    </div> -->
                </div>

                <!-- Table Container -->
                <div class="bg-white rounded-2xl border border-zinc-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr
                                    class="bg-zinc-50/50 border-b border-zinc-200 text-xs uppercase text-zinc-500 font-semibold tracking-wider"
                                >
                                    <th class="py-4 px-6">File</th>
                                    <th class="py-4 px-6">Shared With</th>
                                    <th class="py-4 px-6">Date Shared</th>
                                    <th class="py-4 px-6">Access Level</th>
                                    <th class="py-4 px-6 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody
                                id="shares-history-table"
                                class="divide-y divide-zinc-100 text-sm"
                            >
                                <tr>
                                    <td
                                        colspan="5"
                                        class="text-center text-4xl text-indigo-600/60 py-4"
                                    >
                                        <i class="ri-loader-4-line animate-spin inline-block"></i>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination -->
                    <div
                        class="flex items-center justify-between border-t border-zinc-200 px-6 py-4 bg-zinc-50/50"
                    >
                        <p class="text-sm text-zinc-500" id="pagination-info">
                            Showing <span class="font-medium text-zinc-800">0</span> to
                            <span class="font-medium text-zinc-800">0</span> of
                            <span class="font-medium text-zinc-800">0</span> results
                        </p>
                        <div class="flex gap-2">
                            <button
                                class="px-3 py-1 text-sm border border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-50 hover:text-zinc-800 rounded-md transition-colors"
                                id="paginate-prev-btn"
                                disabled
                            >
                                Previous
                            </button>
                            <button
                                class="px-3 py-1 text-sm border border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-50 hover:text-zinc-800 rounded-md transition-colors"
                                id="paginate-next-btn"
                                disabled
                            >
                                Next
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
