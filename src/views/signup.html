<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Signup - Filemoon</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Inter", sans-serif;
            }
            .animate-blob {
                animation: blob 7s infinite;
            }
            @keyframes blob {
                0% {
                    transform: translate(0px, 0px) scale(1);
                }
                33% {
                    transform: translate(30px, -50px) scale(1.1);
                }
                66% {
                    transform: translate(-20px, 20px) scale(0.9);
                }
                100% {
                    transform: translate(0px, 0px) scale(1);
                }
            }
        </style>
    </head>
    <body class="bg-zinc-50 min-h-screen flex justify-center items-center relative overflow-hidden">
        <!-- Background decoration -->
        <div
            class="absolute top-0 -left-4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"
        ></div>
        <div
            class="absolute top-0 -right-4 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"
            style="animation-delay: 2s"
        ></div>
        <div
            class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"
            style="animation-delay: 4s"
        ></div>

        <div
            class="w-full max-w-[30rem] py-8 px-8 bg-white/80 backdrop-blur-xl rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50 relative z-10 animate__animated animate__fadeInUp"
        >
            <div class="flex justify-center items-center flex-col mb-6">
                <div class="mb-4 relative group">
                    <div
                        class="absolute -inset-1 bg-gradient-to-r from-violet-600 to-indigo-600 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-200"
                    ></div>
                    <div class="relative bg-white rounded-2xl p-3 shadow-sm ring-1 ring-zinc-100">
                        <i
                            class="ri-contrast-2-fill text-4xl text-transparent bg-clip-text bg-gradient-to-br from-violet-600 to-indigo-600 leading-none block"
                        ></i>
                    </div>
                </div>
                <h1 class="text-2xl font-bold text-zinc-800 tracking-tight">Create Account</h1>
                <p class="text-zinc-500 text-sm mt-1">Join Filemoon to manage your files</p>
            </div>
            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1.5" for="avatar"
                        >Profile Picture</label
                    >
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-400 group-focus-within:text-indigo-600 transition-colors"
                        >
                            <i class="ri-image-line text-lg"></i>
                        </div>
                        <input
                            class="w-full border border-zinc-200 bg-zinc-50/50 pl-10 pr-3 py-2 rounded-xl text-sm text-zinc-700 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all duration-200 cursor-pointer"
                            type="file"
                            name="avatar"
                            id="avatar"
                            accept="image/*"
                        />
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1.5" for="fullname"
                        >Full name</label
                    >
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-400 group-focus-within:text-indigo-600 transition-colors"
                        >
                            <i class="ri-user-line text-lg"></i>
                        </div>
                        <input
                            class="w-full border border-zinc-200 bg-zinc-50/50 pl-10 pr-3 py-2.5 rounded-xl text-sm text-zinc-700 placeholder:text-zinc-400 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all duration-200"
                            type="text"
                            name="fullname"
                            id="fullname"
                            placeholder="John Doe"
                            required
                        />
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-1.5" for="email"
                            >Email</label
                        >
                        <div class="relative group">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-400 group-focus-within:text-indigo-600 transition-colors"
                            >
                                <i class="ri-mail-line text-lg"></i>
                            </div>
                            <input
                                class="w-full border border-zinc-200 bg-zinc-50/50 pl-10 pr-3 py-2.5 rounded-xl text-sm text-zinc-700 placeholder:text-zinc-400 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all duration-200"
                                type="email"
                                name="email"
                                id="email"
                                placeholder="example@gmail.com"
                                required
                            />
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-1.5" for="phone"
                            >Phone number</label
                        >
                        <div class="relative group">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-400 group-focus-within:text-indigo-600 transition-colors"
                            >
                                <i class="ri-phone-line text-lg"></i>
                            </div>
                            <input
                                class="w-full border border-zinc-200 bg-zinc-50/50 pl-10 pr-3 py-2.5 rounded-xl text-sm text-zinc-700 placeholder:text-zinc-400 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all duration-200"
                                type="tel"
                                name="phone"
                                id="phone"
                                placeholder="+910123456789"
                                required
                            />
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1.5" for="password"
                        >Password</label
                    >
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-400 group-focus-within:text-indigo-600 transition-colors"
                        >
                            <i class="ri-lock-2-line text-lg"></i>
                        </div>
                        <input
                            class="w-full border border-zinc-200 bg-zinc-50/50 pl-10 pr-3 py-2.5 rounded-xl text-sm text-zinc-700 placeholder:text-zinc-400 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all duration-200"
                            type="password"
                            name="password"
                            id="password"
                            placeholder="••••••••••"
                            required
                        />
                    </div>
                </div>
                <div class="flex items-start mt-2">
                    <div class="flex items-center h-5">
                        <input
                            id="terms"
                            type="checkbox"
                            required
                            class="w-4 h-4 text-indigo-600 bg-zinc-100 border-zinc-300 rounded focus:ring-indigo-500 focus:ring-2"
                        />
                    </div>
                    <label for="terms" class="ml-2 text-sm font-medium text-zinc-500"
                        >I agree to the
                        <a href="#" class="text-indigo-600 hover:underline"
                            >Terms and Conditions</a
                        ></label
                    >
                </div>
                <button
                    class="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-medium py-2.5 rounded-xl shadow-lg shadow-zinc-900/10 hover:shadow-zinc-900/20 active:scale-[0.98] transition-all duration-200 mt-2 cursor-pointer flex justify-center items-center gap-2 group"
                    type="submit"
                >
                    <span>Create Account</span>
                    <i
                        class="ri-arrow-right-line group-hover:translate-x-1 transition-transform"
                    ></i>
                </button>
            </form>
            <div class="text-center mt-6 pt-6 border-t border-zinc-100">
                <p class="text-sm text-zinc-600">
                    Already have an account?
                    <a
                        class="font-semibold text-indigo-600 hover:text-indigo-700 transition-colors decoration-indigo-600/30 underline-offset-4 hover:underline"
                        href="./index.html"
                        >Sign in</a
                    >
                </p>
            </div>
        </div>
    </body>
</html>
